<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>도쿄 매물 트래커</title>
<style>
:root {
  --bg: #f6f5f2; --card: #ffffff; --ink: #1c1b19; --muted: #6f6b63; --line: #e3e0d9;
  --accent: #1f4e79; --accent-soft: #e4edf5; --up: #b3261e; --down: #1a7f4b;
  --new: #b45309; --chip: #efede8; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.05);
}
:root { color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #151514; --card: #1f1f1d; --ink: #ecebe7; --muted: #a09c93; --line: #33322f;
    --accent: #8ab8e0; --accent-soft: #24313d; --up: #f28b82; --down: #6fcf97;
    --new: #f0b35a; --chip: #2a2a27; --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #151514; --card: #1f1f1d; --ink: #ecebe7; --muted: #a09c93; --line: #33322f;
  --accent: #8ab8e0; --accent-soft: #24313d; --up: #f28b82; --down: #6fcf97;
  --new: #f0b35a; --chip: #2a2a27; --shadow: 0 1px 2px rgba(0,0,0,.4);
}
.hrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
#theme { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13px; white-space: nowrap; }
.tabs { display: flex; gap: 4px; margin: 14px 0 0; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: none; padding: 9px 14px; cursor: pointer; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.sctl { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin: 14px 0 6px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { border: 0; background: var(--card); padding: 7px 12px; cursor: pointer; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--card); }
.snote { color: var(--muted); font-size: 13px; margin: 4px 0 14px; }
.sgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); gap: 14px; }
.scard { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); }
.scard h3 { margin: 0 0 8px; font-size: 15px; }
.scard h3 small { color: var(--muted); font-weight: 400; margin-left: 6px; }
table.stat { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
table.stat th { color: var(--muted); font-weight: 500; font-size: 12px; text-align: right; padding: 4px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.stat td { text-align: right; padding: 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.stat th:first-child, table.stat td:first-child { text-align: left; padding-left: 0; }
table.stat tr.link { cursor: pointer; } table.stat tr.link:hover td { color: var(--accent); }
table.stat tr.tot td { font-weight: 700; border-bottom: 0; }
table.stat td.med { font-weight: 700; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Hiragino Sans",
        "Noto Sans KR", "Noto Sans JP", "Segoe UI", sans-serif;
}
button, input, select { font: inherit; color: inherit; }
header.top { padding: 20px 16px 8px; max-width: 1280px; margin: 0 auto; }
header.top h1 { margin: 0; font-size: 22px; letter-spacing: -.01em; }
header.top p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
main { max-width: 1280px; margin: 0 auto; padding: 0 16px 60px; }

.filters {
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px; margin: 12px 0 14px; box-shadow: var(--shadow);
}
.filters summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; }
.filters summary::-webkit-details-marker { display: none; }
.filters summary span { color: var(--muted); font-weight: 400; font-size: 13px; }
.filters summary::after { content: "펼치기 ▾"; color: var(--accent); font-weight: 600; font-size: 13px; }
.filters[open] summary::after { content: "접기 ▴"; }
.frow { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }
.f label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
.f input, .f select {
  width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px;
  background: var(--bg); min-width: 0;
}
.pair { display: flex; gap: 6px; align-items: center; }
.pair span { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.chips .lbl { font-size: 12px; color: var(--muted); width: 100%; margin-bottom: -2px; }
.chip {
  border: 1px solid var(--line); background: var(--bg); border-radius: 999px;
  padding: 5px 11px; font-size: 13px; cursor: pointer; user-select: none;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--card); }
.chip small { opacity: .65; margin-left: 3px; }
.ko { color: var(--muted); font-size: .92em; margin-left: 4px; font-weight: 400; }
.chip[aria-pressed="true"] .ko { color: inherit; opacity: .85; }

.bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 6px 2px 12px; flex-wrap: wrap; }
.bar .count { font-weight: 600; }
.bar .count small { color: var(--muted); font-weight: 400; margin-left: 6px; }
.bar select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--card); }
.bar button { padding: 7px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--card); cursor: pointer; }
.scope { background: var(--accent-soft); border-radius: 10px; padding: 8px 12px; margin-bottom: 12px; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.scope button { border: 0; background: none; color: var(--accent); cursor: pointer; font-weight: 600; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  cursor: pointer; box-shadow: var(--shadow); display: flex; flex-direction: column;
  text-align: left; padding: 0; width: 100%;
}
.card:hover { border-color: var(--accent); }
.card.gone { opacity: .6; }
.thumb { aspect-ratio: 4/3; background: var(--chip); position: relative; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb img.plan { object-fit: contain; background: #fff; }
.badges { position: absolute; top: 8px; left: 8px; display: flex; gap: 5px; flex-wrap: wrap; }
.badge { font-size: 11px; font-weight: 700; padding: 3px 7px; border-radius: 6px; background: rgba(20,20,20,.78); color: #fff; }
.badge.new { background: var(--new); color: #fff; }
.badge.chg { background: #7c3aed; }
.badge.gone { background: #555; }
.cbody { padding: 11px 13px 13px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.cname { font-weight: 650; font-size: 15px; line-height: 1.35; }
.cmeta { color: var(--muted); font-size: 13px; }
.price { font-size: 19px; font-weight: 700; letter-spacing: -.01em; margin-top: 4px; }
.price small { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 6px; }
.delta { font-size: 12px; font-weight: 600; }
.delta.down { color: var(--down); } .delta.up { color: var(--up); }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: auto; padding-top: 7px; }
.tag { font-size: 11px; background: var(--chip); border-radius: 5px; padding: 2px 6px; color: var(--muted); }
.tag.sib { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.tag.rent { background: color-mix(in srgb, var(--down) 16%, transparent); color: var(--down); font-weight: 600; }
table.stat tr.tx td { color: var(--muted); }
table.stat td.kind { text-align: left; padding-left: 6px; font-size: 12px; }
.seg { flex-wrap: wrap; }
table.stat td.band { vertical-align: top; }
table.stat td.diff { font-weight: 600; }
.dealbar { margin: 14px 0 0; }
.empty, .loading { text-align: center; color: var(--muted); padding: 60px 0; }
.more { display: block; margin: 20px auto 0; padding: 10px 22px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); cursor: pointer; }

dialog { border: 0; padding: 0; border-radius: 16px; width: min(920px, 96vw); max-height: 92vh; background: var(--card); color: var(--ink); }
dialog::backdrop { background: rgba(0,0,0,.55); }
.dhead { position: sticky; top: 0; background: var(--card); padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; z-index: 2; }
.dhead h2 { margin: 0; font-size: 18px; line-height: 1.3; }
.dhead p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.dhead button { border: 0; background: var(--chip); border-radius: 999px; width: 34px; height: 34px; cursor: pointer; flex: none; font-size: 16px; }
.dbody { padding: 16px 18px 22px; }
.gallery { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x mandatory; }
.gallery figure { margin: 0; flex: none; width: min(420px, 80vw); scroll-snap-align: start; }
.gallery img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 10px; background: var(--chip); display: block; }
.gallery img.plan { object-fit: contain; background: #fff; }
.gallery figcaption { font-size: 11px; color: var(--muted); margin-top: 3px; }
.dprice { font-size: 24px; font-weight: 750; margin: 12px 0 2px; }
.links { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 4px; }
.links a { text-decoration: none; padding: 8px 13px; border-radius: 9px; background: var(--accent); color: var(--card); font-weight: 600; font-size: 13px; }
.links a.sec { background: var(--chip); color: var(--ink); }
h3 { font-size: 14px; margin: 22px 0 8px; }
table.spec { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.spec th { text-align: left; color: var(--muted); font-weight: 500; width: 9.5em; vertical-align: top; padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.spec td { padding: 6px 0; border-bottom: 1px solid var(--line); word-break: break-word; }
table.rows { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.rows th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px; padding: 5px 8px 5px 0; border-bottom: 1px solid var(--line); }
table.rows td { padding: 7px 8px 7px 0; border-bottom: 1px solid var(--line); }
table.rows tr.link { cursor: pointer; } table.rows tr.link:hover td { color: var(--accent); }
table.rows tr.cur td { font-weight: 700; }
.wrapx { overflow-x: auto; }
footer { text-align: center; color: var(--muted); font-size: 12px; padding: 0 16px 40px; }
</style>
</head>
<body>
<header class="top">
  <div class="hrow"><h1>도쿄 매물 트래커</h1><button id="theme" type="button"></button></div>
  <p id="status">불러오는 중…</p>
  <p>금액은 모두 일본 엔(원화 아님)이고 판매자가 부른 호가입니다. 1억 엔 = 100,000,000엔 · 평당 = 1평(坪, 약 3.3㎡)당 가격</p>
  <nav class="tabs">
    <button type="button" data-tab="list" aria-selected="true">매물</button>
    <button type="button" data-tab="stats" aria-selected="false">시세 분석</button>
  </nav>
</header>
<main>
<section id="tab-stats" hidden>
  <div class="sctl">
    <div class="seg" id="sgroup">
      <button type="button" data-v="area" aria-pressed="true">세부 지역별</button>
      <button type="button" data-v="town" aria-pressed="false">동네(町)별</button>
    </div>
    <div class="seg" id="smetric">
      <button type="button" data-v="price" aria-pressed="true">매매가</button>
      <button type="button" data-v="tsubo" aria-pressed="false">매매 평단가</button>
      <button type="button" data-v="rent" aria-pressed="false">월 임대료</button>
      <button type="button" data-v="rent_tsubo" aria-pressed="false">임대 평단가</button>
    </div>
    <div class="seg" id="speriod">
      <button type="button" data-v="4" aria-pressed="true">실거래 최근 1년</button>
      <button type="button" data-v="8" aria-pressed="false">2년</button>
      <button type="button" data-v="0" aria-pressed="false">전체</button>
    </div>
  </div>
  <p class="snote" id="snote"></p>
  <div class="sgrid" id="sgrid"></div>
</section>
<section id="tab-list">
  <div class="dealbar"><div class="seg" id="deal">
    <button type="button" data-v="buy" aria-pressed="true">매매</button>
    <button type="button" data-v="rent" aria-pressed="false">임대</button>
  </div></div>
  <details class="filters" open>
    <summary>검색 조건 <span id="fsum"></span></summary>
    <div class="frow">
      <div class="f"><label for="q">건물명 · 주소</label><input id="q" type="search" placeholder="예: 麻布, タワー"></div>
      <div class="f"><label id="plabel">가격 (억 엔)</label><div class="pair"><input id="pmin" type="number" min="0" step="0.5" placeholder="최소" inputmode="decimal"><span>~</span><input id="pmax" type="number" min="0" step="0.5" placeholder="최대" inputmode="decimal"></div></div>
      <div class="f"><label>전용면적 (㎡)</label><div class="pair"><input id="amin" type="number" min="0" step="10" placeholder="최소" inputmode="decimal"><span>~</span><input id="amax" type="number" min="0" step="10" placeholder="최대" inputmode="decimal"></div></div>
      <div class="f"><label for="ymin">준공 연도 (이후)</label><input id="ymin" type="number" min="1950" max="2100" placeholder="예: 2010" inputmode="numeric"></div>
      <div class="f"><label for="town">동네 (町)</label><select id="town"><option value="">전체</option></select></div>
    </div>
    <div class="chips" id="areas"><span class="lbl">세부 지역</span></div>
    <div class="chips" id="rooms"><span class="lbl">방 개수</span></div>
    <div class="chips" id="flags"><span class="lbl">조건</span></div>
  </details>

  <div class="scope" id="scope" hidden><span id="scopeText"></span><button id="scopeClear">전체 보기</button></div>
  <div class="bar">
    <div class="count" id="count"></div>
    <div style="display:flex;gap:8px">
      <button id="reset">조건 초기화</button>
      <select id="sort" aria-label="정렬">
        <option value="new">최신 등록순</option>
        <option value="price_desc">가격 높은순</option>
        <option value="price_asc">가격 낮은순</option>
        <option value="tsubo_asc">평단가 낮은순</option>
        <option value="tsubo_desc">평단가 높은순</option>
        <option value="area_desc">면적 넓은순</option>
        <option value="year_desc">준공 최신순</option>
        <option value="yield_desc">예상 수익률 높은순</option>
      </select>
    </div>
  </div>
  <div id="grid" class="grid"></div>
  <div id="after"></div>
</section>
</main>
<footer>실거래가 출처: 国土交通省 不動産情報ライブラリ(不動産取引価格情報・成約価格情報)를 가공해 작성. 매물 정보의 출처와 권리는 각 게재처에 있으며, 실제 조건은 원문 페이지에서 확인하세요.</footer>

function ko(name) {
  if (!name) return "";
  const parts = String(name).split("・");
  if (!parts.some(p => KO[p])) return "";
  return parts.map(p => KO[p] || p).join("·");
}
const koSpan = name => { const k = ko(name); return k ? `<span class="ko">${k}</span>` : ""; };
const koPlace = r => [ko(r.ward), ko(r.town)].filter(Boolean).join(" ") + (r.town && ko(r.town) && r.chome ? ` ${r.chome}초메` : "");

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const img = p => p ? (p.startsWith("http") ? p : SITE + p) : "";

async function sb(path) {
  const r = await fetch(`${SB_URL}/rest/v1/${path}`, { headers: { apikey: SB_KEY } });
  if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  return r.json();
}
async function sbAll(path) {
  const out = [];
  for (let off = 0; ; off += 1000) {
    const rows = await sb(`${path}&limit=1000&offset=${off}`);
    out.push(...rows);
    if (rows.length < 1000) return out;
  }
}

function man(v) {            // 万円 → "1억 3,980만 엔"
  if (v == null) return "-";
  v = Math.round(Number(v));
  const oku = Math.floor(v / 10000), rest = v % 10000;
  return (oku ? `${oku}억 ` : "") + (rest ? `${rest.toLocaleString()}만 ` : "") + "엔";
}
const yen = v => v == null ? "-" : `${Number(v).toLocaleString()}엔`;
const dec = (v, d = 1) => Number(v).toLocaleString(undefined, { maximumFractionDigits: d });
const rentMan = v => v == null ? "-" : `${dec(v)}만 엔`;                 // 월 임대료(万円)
const money = r => r.deal_type === "rent" ? `월 ${rentMan(r.price_man)}` : man(r.price_man);
const tsuboTxt = r => !r.price_per_tsubo_man ? "" : r.deal_type === "rent"
  ? `평당 월 ${dec(r.price_per_tsubo_man, 2)}만 엔` : `평당 ${Math.round(r.price_per_tsubo_man).toLocaleString()}만 엔`;
const rooms = l => { const m = /^(\d+)/.exec(l || ""); return m ? +m[1] : null; };
const where = r => `${r.town || ""}${r.chome ? r.chome + "丁目" : ""}`;
function unitLine(r) {
  return [r.wing, r.floor != null ? `${r.floor}층` : null, r.layout, r.area_sqm ? `${Number(r.area_sqm)}㎡` : null,
          r.orientation].filter(Boolean).join(" · ");
}
function delta(r) {
  if (r.initial_price_man == null || r.price_man == null) return "";
  const d = Number(r.price_man) - Number(r.initial_price_man);
  if (!d) return "";
  const pct = (d / Number(r.initial_price_man) * 100).toFixed(1);
  const amt = r.deal_type === "rent" ? rentMan(Math.abs(d)) : man(Math.abs(d));
  return `<span class="delta ${d < 0 ? "down" : "up"}">${d < 0 ? "▼" : "▲"} ${amt} (${pct}%)</span>`;
}

// ---------------------------------------------------------------- state
let ALL = [], BUY = [], RENT = [], TX = null, shown = PAGE;   // ALL = 지금 보는 쪽(매매 또는 임대)
const BY = { buy: new Map(), rent: new Map() };                // 건물코드 → 게재 중 매물
const st = { deal: "buy", areas: new Set(), rooms: new Set(), flags: new Set(), bldg: null };
const other = () => st.deal === "buy" ? "rent" : "buy";
const FLAGS = [
  ["new", "신착"], ["chg", "가격 변동"], ["sib", "같은 건물에 다른 매물"],
  ["both", "같은 건물에 매매·임대 둘 다"],
  ["dup", "같은 호실 재등록"], ["gone", "종료된 매물 포함"],
];

const CHIPS = [];
const syncChips = () => CHIPS.forEach(c => c.b.setAttribute("aria-pressed", c.set.has(c.key)));
function chip(box, key, label, set, n) {
  const b = document.createElement("button");
  CHIPS.push({ b, key, set });
  b.className = "chip"; b.type = "button"; b.setAttribute("aria-pressed", "false");
  b.innerHTML = esc(label) + koSpan(label) + (n != null ? `<small>${n}</small>` : "");
  b.onclick = () => {
    set.has(key) ? set.delete(key) : set.add(key);
    b.setAttribute("aria-pressed", set.has(key)); shown = PAGE; render();
  };
  box.appendChild(b);
}

let wired = false;
function buildFilters() {
  // 매매/임대를 바꿀 때마다 다시 그린다
  CHIPS.length = 0;
  document.querySelectorAll(".chips .chip").forEach(c => c.remove());
  $("#town").innerHTML = `<option value="">전체</option>`;
  $("#plabel").textContent = st.deal === "rent" ? "월 임대료 (만 엔)" : "가격 (억 엔)";
  $("#sort").querySelector('[value="yield_desc"]').hidden = st.deal === "rent";
  const act = ALL.filter(r => r.is_active);
  const ac = new Map();
  for (const r of act) (r.area_codes || []).forEach((c, i) => {
    const e = ac.get(c) || { name: r.area_names[i], n: 0 }; e.n++; ac.set(c, e);
  });
  [...ac.entries()].sort((a, b) => b[1].n - a[1].n)
    .forEach(([c, e]) => chip($("#areas"), c, e.name, st.areas, e.n));
  [[1, "1"], [2, "2"], [3, "3"], [4, "4 이상"]].forEach(([k, l]) => chip($("#rooms"), k, l, st.rooms));
  FLAGS.forEach(([k, l]) => chip($("#flags"), k, l, st.flags));

  const towns = new Map();
  for (const r of act) if (r.town) towns.set(r.town, (towns.get(r.town) || 0) + 1);
  $("#town").insertAdjacentHTML("beforeend", [...towns.entries()].sort((a, b) => b[1] - a[1])
    .map(([t, n]) => `<option value="${esc(t)}">${esc(t)} ${ko(t)} (${n})</option>`).join(""));

  if (wired) return;
  wired = true;
  for (const id of ["q", "pmin", "pmax", "amin", "amax", "ymin", "town", "sort"])
    $("#" + id).addEventListener("input", () => { shown = PAGE; render(); });
  $("#deal").addEventListener("click", e => { const b = e.target.closest("button"); if (b) setDeal(b.dataset.v); });
  $("#reset").onclick = () => {
    for (const id of ["q", "pmin", "pmax", "amin", "amax", "ymin", "town"]) $("#" + id).value = "";
    st.areas.clear(); st.rooms.clear(); st.flags.clear(); st.bldg = null;
    syncChips(); shown = PAGE; render();
  };
  $("#scopeClear").onclick = () => { st.bldg = null; shown = PAGE; render(); };
}

function setDeal(v) {
  if (st.deal !== v) {
    st.deal = v; ALL = v === "buy" ? BUY : RENT;
    $("#deal").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x.dataset.v === v));
    if ($("#sort").value === "yield_desc" && v === "rent") $("#sort").value = "new";
    buildFilters();
  }
  $("#reset").click();
}

function filtered() {
  const q = $("#q").value.trim().toLowerCase();
  const n = id => { const v = parseFloat($("#" + id).value); return isNaN(v) ? null : v; };
  const pmin = n("pmin"), pmax = n("pmax"), amin = n("amin"), amax = n("amax"), ymin = n("ymin");
  const town = $("#town").value;
  const rows = ALL.filter(r => {
    if (st.bldg) return r.bldg_code === st.bldg;          // 건물 보기는 종료 매물도 포함
    if (!r.is_active && !st.flags.has("gone")) return false;
    if (q && !`${r.bldg_name} ${r.address} ${r.route_summary || ""}`.toLowerCase().includes(q)) return false;
    const p = Number(r.price_man) / (st.deal === "rent" ? 1 : 10000), a = Number(r.area_sqm);
    if (pmin != null && !(p >= pmin)) return false;
    if (pmax != null && !(p <= pmax)) return false;
    if (amin != null && !(a >= amin)) return false;
    if (amax != null && !(a <= amax)) return false;
    if (ymin != null && !(r.completed_year >= ymin)) return false;
    if (town && r.town !== town) return false;
    if (st.areas.size && !(r.area_codes || []).some(c => st.areas.has(c))) return false;
    if (st.rooms.size) { const k = rooms(r.layout); if (k == null || !st.rooms.has(Math.min(k, 4))) return false; }
    if (st.flags.has("new") && !r.is_new) return false;
    if (st.flags.has("chg") && !(r.is_price_changed || r.price_changes > 0)) return false;
    if (st.flags.has("sib") && !r.has_other_listing_in_bldg) return false;
    if (st.flags.has("dup") && !(r.same_unit_listings > 1)) return false;
    if (st.flags.has("both") && !BY[other()].has(r.bldg_code)) return false;
    return true;
  });
  const num = (v, d) => v == null ? d : Number(v);
  const S = {
    new: (a, b) => b.first_seen.localeCompare(a.first_seen) || (b.is_new - a.is_new) || b.prop_code.localeCompare(a.prop_code),
    price_desc: (a, b) => num(b.price_man, 0) - num(a.price_man, 0),
    price_asc: (a, b) => num(a.price_man, 1e12) - num(b.price_man, 1e12),
    tsubo_asc: (a, b) => num(a.price_per_tsubo_man, 1e12) - num(b.price_per_tsubo_man, 1e12),
    tsubo_desc: (a, b) => num(b.price_per_tsubo_man, 0) - num(a.price_per_tsubo_man, 0),
    area_desc: (a, b) => num(b.area_sqm, 0) - num(a.area_sqm, 0),
    year_desc: (a, b) => num(b.completed_ym, 0) - num(a.completed_ym, 0),
    yield_desc: (a, b) => num(b.est_gross_yield_pct, -1) - num(a.est_gross_yield_pct, -1),
  };
  return rows.sort(S[$("#sort").value]);
}

// 같은 건물의 반대편(매매↔임대) 매물 표시
function crossTag(r) {
  const o = BY[r.deal_type === "buy" ? "rent" : "buy"].get(r.bldg_code);
  if (!o) return "";
  if (r.deal_type === "rent") return `<span class="tag rent">같은 건물 매매 ${o.length}건</span>`;
  return `<span class="tag rent">임대 ${o.length}건${r.est_gross_yield_pct ? ` · 예상 수익률 ${dec(r.est_gross_yield_pct)}%` : ""}</span>`;
}

function cardHTML(r) {
  const badges = [
    !r.is_active ? `<span class="badge gone">종료 ${esc(r.delisted_on)}</span>` : "",
    r.is_new ? `<span class="badge new">신착</span>` : "",
    r.is_price_changed ? `<span class="badge chg">가격 개정</span>` : "",
  ].join("");
  const sib = r.bldg_active_listings - (r.is_active ? 1 : 0);
  return `<button class="card ${r.is_active ? "" : "gone"}" data-id="${r.id}">
    <div class="thumb"><img loading="lazy" referrerpolicy="no-referrer" alt="" src="${esc(img(r.thumb || bldgPhoto(r.bldg_code)))}" data-fb="${esc(img(r.layout_image))}">
      <div class="badges">${badges}${r.thumb ? "" : `<span class="badge">건물 사진</span>`}</div></div>
    <div class="cbody">
      <div class="cname">${esc(r.bldg_name)}</div>
      <div class="cmeta">${esc(where(r))}${koSpan(r.town)} · ${esc(unitLine(r))}</div>
      <div class="price">${money(r)}${tsuboTxt(r) ? `<small>${tsuboTxt(r)}</small>` : ""}</div>
      ${delta(r)}
      <div class="cmeta">${r.completed_year ? `${r.completed_year}년 준공` : ""}${r.route_summary ? ` · ${esc(r.route_summary)}` : ""}</div>
      <div class="tags">
        ${sib > 0 ? `<span class="tag sib">같은 건물 +${sib}건</span>` : ""}
        ${crossTag(r)}
        ${r.same_unit_listings > 1 ? `<span class="tag sib">같은 호실 재등록</span>` : ""}
        ${(r.area_names || []).map(a => `<span class="tag">${esc(a)}${koSpan(a)}</span>`).join("")}
      </div>
    </div></button>`;
}

function render() {
  const rows = filtered();
  const bl = new Set(rows.map(r => r.bldg_code)).size;
  $("#count").innerHTML = `${rows.length.toLocaleString()}건<small>건물 ${bl.toLocaleString()}동</small>`;
  const sc = $("#scope");
  if (st.bldg) { sc.hidden = false; $("#scopeText").textContent = `${rows[0]?.bldg_name || ""} — 이 건물의 매물만 보는 중 (종료 포함)`; }
  else sc.hidden = true;
  $("#grid").innerHTML = rows.slice(0, shown).map(cardHTML).join("");
  $("#after").innerHTML = !rows.length ? `<div class="empty">조건에 맞는 매물이 없습니다.</div>`
    : rows.length > shown ? `<button class="more" id="more">더 보기 (${(rows.length - shown).toLocaleString()}건 남음)</button>` : "";
  const m = $("#more"); if (m) m.onclick = () => { shown += PAGE; render(); };
}

      ${row("예상 표면 수익률", estRent ? `연 ${dec(d.est_gross_yield_pct, 2)}% <span class="cmeta">— 같은 건물 임대 ${d.bldg_rent_listings}건의 ㎡당 임대료 중앙값으로 이 면적을 환산하면 월 약 ${rentMan(estRent)}. 관리비·세금·공실은 뺀 값입니다.</span>` : "")}
      ${row("전용면적", d.area_sqm ? `${Number(d.area_sqm)}㎡ (${Number(d.area_tsubo)}坪)` : "")}
      ${row("방 구성 · 방위", esc([d.layout, d.orientation].filter(Boolean).join(" · ")))}
      ${row("층", d.floor != null ? `${d.floor}층${floors ? ` (${floors})` : ""}` : "")}
      ${row("발코니", esc(d.balcony))}
      ${row("관리비", d.admin_fee_yen != null ? `월 ${yen(d.admin_fee_yen)}` : "")}
      ${row("수선적립금", d.repair_reserve_yen != null ? `월 ${yen(d.repair_reserve_yen)}` : "")}
      ${row("월 고정비 합계", d.repair_reserve_yen != null && monthly ? `월 ${yen(monthly)} <span class="cmeta">(관리비+수선적립금)</span>` : "")}
      ${row("기타 비용", esc(d.other_fee))}
      ${row("현황 · 인도", esc([d.occupancy, d.handover].filter(Boolean).join(" · ")))}
      ${row("주차장", esc(d.parking))}
      ${row("거래 형태", esc(d.transaction_type))}
      ${row("특징", list(d.features))}
      ${row("실내 설비", list(d.equipment))}
      ${row("비고", esc(d.remarks))}
      ${row("정보 갱신일", esc(d.info_updated_on))}
      ${row("처음 확인한 날", esc(d.first_seen))}
    </table>
    ${d.detail_fetched_at ? "" : `<p class="cmeta">상세 정보는 아직 수집되지 않았습니다.</p>`}

    <h3>건물</h3>
    <table class="spec">
      ${row("세부 지역", (d.area_names || []).map(a => esc(a) + koSpan(a)).join(" / "))}
      ${row("교통", esc(d.access || d.route_summary))}
      ${row("준공", d.completed_ym ? `${d.completed_ym.slice(0, 4)}년 ${+d.completed_ym.slice(4, 6) || ""}${+d.completed_ym.slice(4, 6) ? "월" : ""}` : "")}
      ${row("구조 · 규모", esc([d.structure, floors, d.total_units ? `총 ${d.total_units}호` : null].filter(Boolean).join(" · ")))}
      ${row("토지 권리", esc(d.land_right))}
      ${row("분양 · 시공", esc([d.developer, d.builder].filter(Boolean).join(" / ")))}
      ${row("관리", esc([d.mgmt_company, d.mgmt_type].filter(Boolean).join(" · ")))}
      ${row("학군 (초등)", esc(d.school))}
      ${row("공용 시설", list(d.facilities))}
    </table>

    <h3>변동 이력</h3>
    <div class="wrapx"><table class="rows"><tr><th>날짜</th><th>구분</th><th>내용</th></tr>
      ${events.map(e => `<tr><td>${esc(e.observed_on)}</td><td>${EV[e.event] || esc(e.event)}</td><td>${changesText(e, pm)}</td></tr>`).join("")}
    </table></div>

    <h3>같은 건물의 ${isRent ? "임대" : "매매"} 매물 (${sibs.length}건${sibs.some(s => !s.is_active) ? ", 종료 포함" : ""})</h3>
    <div class="wrapx"><table class="rows">${sibHead}${sibRows(sibs, d.id)}</table></div>

    <h3>같은 건물의 ${isRent ? "매매" : "임대"} 매물 (${cross.length}건)</h3>
    ${cross.length ? `<div class="wrapx"><table class="rows">${sibHead}${sibRows(cross, -1)}</table></div>`
      : `<p class="cmeta">지금 게재 중인 ${isRent ? "매매" : "임대"} 매물이 없습니다.</p>`}
  </div>`;
}

// 사진 로드 실패 시: 대체 이미지(평면도)로 한 번 바꿔 보고, 그것도 실패하면 숨긴다
document.addEventListener("error", e => {
  const i = e.target;
  if (!(i instanceof HTMLImageElement)) return;
  const fb = i.dataset.fb;
  if (fb && i.src !== fb) { delete i.dataset.fb; i.classList.add("plan"); i.src = fb; }
  else (i.closest("figure") || i).style.display = "none";
}, true);

$("#grid").addEventListener("click", e => { const c = e.target.closest(".card"); if (c) openDetail(+c.dataset.id); });
$("#dlg").addEventListener("click", e => {
  if (e.target === $("#dlg") || e.target.closest("[data-close]")) return $("#dlg").close();
  const tr = e.target.closest("tr.link"); if (tr) openDetail(+tr.dataset.id);
});

// ---------------------------------------------------------------- stats
const BANDS = [[0, 50, "50㎡ 미만"], [50, 70, "50~70㎡"], [70, 100, "70~100㎡"], [100, 150, "100~150㎡"], [150, 1e9, "150㎡ 이상"]];
const sst = { group: "area", metric: "price", period: 4 };
const TSUBO = 3.305785;
const METRIC = {
  price: { deal: "buy", f: r => +r.price_man, tx: t => +t.price_man,
           fmt: v => (v / 10000).toFixed(2) + "억", label: "매매가(억 엔)" },
  tsubo: { deal: "buy", f: r => +r.price_per_tsubo_man, tx: t => t.price_man / (t.area_sqm / TSUBO),
           fmt: v => Math.round(v).toLocaleString() + "만", label: "매매 평단가(만 엔/坪)" },
  rent: { deal: "rent", f: r => +r.price_man, fmt: v => dec(v) + "만", label: "월 임대료(만 엔)" },
  rent_tsubo: { deal: "rent", f: r => +r.price_per_tsubo_man, fmt: v => dec(v, 2) + "만",
                label: "임대 평단가(월, 만 엔/坪)" },
};

function agg(rows, f) {
  const a = rows.map(f).filter(x => x > 0).sort((x, y) => x - y);
  if (!a.length) return null;
  const m = a.length >> 1;
  return { n: a.length, avg: a.reduce((s, x) => s + x, 0) / a.length,
           med: a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2, min: a[0], max: a[a.length - 1] };
}

async function renderStats() {
  const M = METRIC[sst.metric];
  $("#speriod").hidden = !M.tx;
  if (M.tx && !TX) {
    $("#sgrid").innerHTML = `<div class="loading">실거래가를 불러오는 중…</div>`;
    try { TX = await sbAll("transactions?select=town,source_kind,period,price_man,area_sqm&order=id"); }
    catch (e) { TX = []; }
    if (METRIC[sst.metric] !== M) return renderStats();
  }
  const rows = (M.deal === "buy" ? BUY : RENT)
    .filter(r => r.is_active && Number(r.area_sqm) > 0 && Number(r.price_man) > 0);
  const groups = new Map([["__all", { name: "전체", rows, towns: null }]]);
  for (const r of rows) {
    const keys = sst.group === "area" ? (r.area_codes || []).map((c, i) => [c, r.area_names[i]])
                                      : r.town ? [[r.town, r.town]] : [];
    for (const [k, name] of keys) {
      if (!groups.has(k)) groups.set(k, { name, rows: [], towns: new Set() });
      const g = groups.get(k); g.rows.push(r); if (r.town) g.towns.add(r.town);
    }
  }
  // 실거래: 최근 N개 분기만
  let tx = [], txLabel = "";
  if (M.tx) {
    const periods = [...new Set(TX.map(t => t.period))].sort((a, b) => b - a);
    const keep = new Set(sst.period ? periods.slice(0, sst.period) : periods);
    tx = TX.filter(t => keep.has(t.period) && t.area_sqm > 0);
    const q = p => `${Math.floor(p / 10)}년 ${p % 10}분기`;
    const ks = [...keep].sort((a, b) => a - b);
    txLabel = ks.length ? `${q(ks[0])}~${q(ks[ks.length - 1])}` : "";
  }
  const { f, fmt } = M;
  const cells = s => s ? `<td>${s.n}</td><td>${fmt(s.avg)}</td><td class="med">${fmt(s.med)}</td><td>${fmt(s.min)}</td><td>${fmt(s.max)}</td>`
                       : `<td>0</td><td>-</td><td>-</td><td>-</td><td>-</td>`;
  const line = (label, k, b, ask, txs, tot) => {
    if (!ask && !txs) return "";
    const diff = ask && txs ? Math.round((ask.med / txs.med - 1) * 100) : null;
    return `<tr class="link ${tot && !M.tx ? "tot" : ""}" data-k="${esc(k)}" data-b="${b}">
        <td class="band" ${M.tx ? `rowspan="2"` : ""}>${tot ? "<b>전체</b>" : label}</td>
        ${M.tx ? `<td class="kind">호가</td>` : ""}${cells(ask)}
        ${M.tx ? `<td class="diff" rowspan="2">${diff == null ? "-" : (diff > 0 ? "+" : "") + diff + "%"}</td>` : ""}</tr>`
      + (M.tx ? `<tr class="tx"><td class="kind">실거래</td>${cells(txs)}</tr>` : "");
  };

  $("#snote").innerHTML = `<b>${M.label}</b> · ${M.deal === "buy" ? "매매" : "임대"} 게재 매물 ${rows.length.toLocaleString()}건의 호가 기준. `
    + (sst.group === "area" ? "한 건물이 여러 세부 지역에 속하면 각각에 집계됩니다. " : "")
    + "호가 행을 누르면 해당 매물 목록으로 이동합니다. "
    + (M.tx ? `<br>실거래는 국토교통성 공개 자료(${txLabel}, 미나토구 중고 맨션 ${tx.length.toLocaleString()}건)입니다. `
        + "건물명이 공개되지 않아 동네·면적 단위로만 비교할 수 있고, 면적은 5㎡ 단위로 반올림돼 있습니다. "
        + "실거래에는 오래된 건물과 일반 맨션이 모두 섞여 있지만 이 사이트의 호가는 고급 매물 위주라, 차이(%)가 그대로 '깎을 수 있는 폭'을 뜻하지는 않습니다."
        + (sst.group === "area" ? " 세부 지역의 실거래는 그 지역 매물이 있는 동네들의 거래를 모은 것입니다." : "") : "");

  $("#sgrid").innerHTML = [...groups.entries()]
    .sort((a, b) => (b[0] === "__all") - (a[0] === "__all") || b[1].rows.length - a[1].rows.length)
    .map(([k, g]) => {
      const gtx = !M.tx ? [] : g.towns ? tx.filter(t => g.towns.has(t.town)) : tx;
      const body = BANDS.map(([lo, hi, label], i) => line(label, k, i,
        agg(g.rows.filter(r => r.area_sqm >= lo && r.area_sqm < hi), f),
        M.tx ? agg(gtx.filter(t => t.area_sqm >= lo && t.area_sqm < hi), M.tx) : null)).join("");
      return `<div class="scard"><h3>${esc(g.name)}${koSpan(g.name)}<small>${g.rows.length}건</small></h3>
        <div class="wrapx"><table class="stat">
          <tr><th>전용면적</th>${M.tx ? "<th></th>" : ""}<th>건수</th><th>평균</th><th>중앙값</th><th>최저</th><th>최대</th>${M.tx ? "<th>중앙값 차이</th>" : ""}</tr>
          ${body}
          ${line("", k, "", agg(g.rows, f), M.tx ? agg(gtx, M.tx) : null, true)}
        </table></div></div>`;
    }).join("");
}

function showTab(name) {
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === name));
  $("#tab-list").hidden = name !== "list";
  $("#tab-stats").hidden = name !== "stats";
  if (name === "stats") renderStats();
}
document.querySelector(".tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) showTab(b.dataset.tab); });
for (const [id, key] of [["sgroup", "group"], ["smetric", "metric"], ["speriod", "period"]])
  $("#" + id).addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    sst[key] = key === "period" ? +b.dataset.v : b.dataset.v;
    $("#" + id).querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    renderStats();
  });
// 분석 표의 행 → 같은 조건으로 매물 목록 열기
$("#sgrid").addEventListener("click", e => {
  const tr = e.target.closest("tr.link"); if (!tr) return;
  setDeal(METRIC[sst.metric].deal);          // 조건 초기화 포함
  const k = tr.dataset.k, b = tr.dataset.b;
  if (k !== "__all") { if (sst.group === "area") st.areas.add(k); else $("#town").value = k; }
  if (b !== "") {
    const [lo, hi] = BANDS[+b];
    $("#amin").value = lo || ""; $("#amax").value = hi < 1e9 ? hi - 0.01 : "";
  }
  syncChips(); shown = PAGE; render(); showTab("list"); scrollTo(0, 0);
});

// ---------------------------------------------------------------- theme
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
function applyTheme(t) {
  const sysDark = matchMedia("(prefers-color-scheme: dark)").matches;
  if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  const dark = t ? t === "dark" : sysDark;
  $("#theme").textContent = dark ? "☀ 라이트 모드" : "🌙 다크 모드";
  $("#theme").onclick = () => { const n = dark ? "light" : "dark"; store.set("theme", n); applyTheme(n); };
}
applyTheme(store.get("theme"));

// ---------------------------------------------------------------- boot
if (innerWidth < 480) document.querySelector(".filters").open = false;   // 폰에서만 접어 둔다
(async () => {
  try {
    const [rows, runs] = await Promise.all([
      sbAll(`listings_enriched?select=${LIST_COLS}&order=id`),
      sb("scrape_runs?select=started_at&order=started_at.desc&limit=1"),
    ]);
    BUY = rows.filter(r => r.deal_type !== "rent");
    RENT = rows.filter(r => r.deal_type === "rent");
    ALL = BUY;
    for (const r of rows) if (r.is_active) {
      const m = BY[r.deal_type === "rent" ? "rent" : "buy"];
      m.has(r.bldg_code) ? m.get(r.bldg_code).push(r) : m.set(r.bldg_code, [r]);
    }
    const act = a => a.filter(r => r.is_active).length.toLocaleString();
    const when = runs[0] ? new Date(runs[0].started_at).toLocaleString("ko-KR", { dateStyle: "medium", timeStyle: "short" }) : "-";
    $("#status").textContent = `게재 중 매매 ${act(BUY)}건 · 임대 ${act(RENT)}건 · 마지막 수집 ${when}`;
    buildFilters(); render();
  } catch (e) {
    $("#status").textContent = "데이터를 불러오지 못했습니다.";
    $("#grid").outerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
})();
</script>
