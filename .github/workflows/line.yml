name: Daily LINE picks

# GitHub 의 예약 실행은 몇 시간씩 늦거나 건너뛸 수 있다. 그래서 시각을 여러 개 걸어 두고,
# 그날(일본 시간) 이미 성공한 실행이 있으면 건너뛴다 → 가장 먼저 도는 한 번만 전송된다.
on:
  schedule:
    - cron: "7 23 * * *"  # 08:07 JST
    - cron: "37 23 * * *" # 08:37 JST (예비)
    - cron: "17 0 * * *"  # 09:17 JST (예비)
    - cron: "17 1 * * *"  # 10:17 JST (예비)
  workflow_dispatch:

concurrency:
  group: line
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_TO: ${{ secrets.LINE_TO }}
    steps:
      - name: Already sent today?
        id: once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(TZ=Asia/Tokyo date +%F)
          n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow line.yml --status success --limit 30 \
                --json createdAt,databaseId \
                -q "[.[] | select(.databaseId != $GITHUB_RUN_ID) | select((.createdAt | fromdateiso8601 + 32400 | strftime(\"%Y-%m-%d\")) == \"$today\")] | length")
          echo "오늘($today) 이미 성공한 실행: $n"
          echo "sent=$n" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: github.event_name != 'schedule' || steps.once.outputs.sent == '0'
      - uses: actions/setup-python@v5
        if: github.event_name != 'schedule' || steps.once.outputs.sent == '0'
        with:
          python-version: "3.11"
      - name: Send picks
        if: github.event_name != 'schedule' || steps.once.outputs.sent == '0'
        run: |
          if [ -z "$LINE_CHANNEL_ACCESS_TOKEN" ]; then
            echo "LINE 토큰이 등록되지 않아 미리보기만 출력합니다."
            python line_daily.py
          else
            python line_daily.py --send
          fi
